<!doctype html>
<html lang="es">
<head>

  <title>{% block titulo %}Academia Horizonte{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block cuerpo %}{% endblock %}">

</body>
</html>
